name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest -q

  image:
    # Builds the cleanup CronJob image exactly as documented and smoke-tests
    # both binaries inside it. Nothing is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile.previewctl
        run: docker build -f Dockerfile.previewctl -t previewctl:ci .
      - name: previewctl runs in the image
        run: docker run --rm previewctl:ci cleanup --help
      - name: kubectl runs in the image
        run: docker run --rm --entrypoint kubectl previewctl:ci version --client
      - name: image runs as non-root
        run: test "$(docker run --rm --entrypoint id previewctl:ci -u)" = 65532
