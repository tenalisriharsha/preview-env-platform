apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  rules:
    # The host is a placeholder: previewctl render patches it to
    # pr-<N>.<domain> for each pull request.
    - host: pr-0.preview.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
