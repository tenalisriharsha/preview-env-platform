# Hourly safety net: deletes preview namespaces older than 24h, catching
# anything the teardown workflow missed (failed runs, deleted repos,
# workflows that never fired).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: preview-cleanup
  namespace: previewctl-system
  labels:
    app.kubernetes.io/name: preview-cleanup
    app.kubernetes.io/part-of: preview-env-platform
spec:
  schedule: "0 * * * *"
  timeZone: Etc/UTC
  # Never run two sweeps at once; a late start is skipped, not stacked.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: preview-cleanup
        spec:
          serviceAccountName: preview-cleanup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              # Resolved by the images: entry in kustomization.yaml.
              image: previewctl
              imagePullPolicy: IfNotPresent
              args: ["cleanup", "--ttl", "24h"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                # kubectl's discovery cache ($HOME=/tmp in the image).
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
